[project]
name = "nexusearch"
version = "0.2.1"
description = "Universal multi-iteration live web discovery + deep page reading (profile-driven)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "duckduckgo-search>=6.0.0",
]

[project.optional-dependencies]
tavily = ["tavily-python>=0.3.3"]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexusearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
