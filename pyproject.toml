[project]
name = "nexusearch"
version = "0.5.2"
description = "Universal multi-iteration live web discovery + deep page reading (profile-driven)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "ddgs>=9.0.0",
]

[project.optional-dependencies]
tavily = ["tavily-python>=0.3.3"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "redis>=5.0.0", "ruff>=0.4.0"]
redis = ["redis>=5.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexusearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/nexusearch"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 75
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\."]
